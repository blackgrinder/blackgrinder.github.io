{% assign year = site.time | date: "%Y" | round %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ page.title }}</title>
        <link rel="stylesheet" href="/assets/css/main.css">
    </head>
    <body>
        {{ content }}
        <footer style="margin-top: 36px">
            {% if site.data.globals.initial_year < year %}
                {{ site.data.globals.initial_year }}-{{ year }}
            {% else %}
                {{ year }}
            {% endif %} 
        </footer>
    </body>
</html>
